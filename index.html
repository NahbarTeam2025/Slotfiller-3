<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Automatische Terminvergabe und SMS-Benachrichtigungen für Dienstleister. Kein Termin bleibt leer." />
    <title>SlotFiller</title>
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.bunny.net" />
    
    <link rel="preload" as="style" href="https://fonts.bunny.net/css?family=inter:300,400,500,600,700|outfit:400,700,900&display=swap" />
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:300,400,500,600,700|outfit:400,700,900&display=swap" media="print" onload="this.media='all'" />
    
    <link rel="preconnect" href="https://robert-n8n-477405.firebaseapp.com" />
    <link rel="preconnect" href="https://www.googleapis.com" />

    <style>
      :root {
        --font-sans: ui-sans-serif, system-ui, -apple-system, sans-serif;
        --color-deep-blue: #1a1a2e;
        --bg-light: #f8fafc;
        --bg-dark: #020617;
      }
      body {
        margin: 0;
        background-color: var(--bg-light);
        color: var(--color-deep-blue);
        -webkit-font-smoothing: antialiased;
        font-family: var(--font-sans);
      }
      body.loading {
        overflow: hidden;
      }
      .splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background-color: var(--bg-light);
        color: var(--color-deep-blue);
        transition: opacity 0.4s ease-out;
      }
      @media (prefers-color-scheme: dark) {
        body.loading { background-color: var(--bg-dark); color: #ffffff; }
        .splash-screen { background-color: var(--bg-dark); color: #ffffff; }
      }
      /* Ensure that once loading is done, the app's own styles take over completely */
      body:not(.loading) {
        background-color: transparent;
      }
      .splash-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
        letter-spacing: -0.025em;
      }
      .splash-subtitle {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.5;
        margin: 0;
      }
    </style>
  </head>
  <body class="loading">
    <div id="root">
      <div class="splash-screen" id="splash">
        <h1 class="splash-title">SlotFiller</h1>
        <p class="splash-subtitle">Kein Termin bleibt leer.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const finishLoading = () => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => {
              splash.remove();
              document.body.classList.remove('loading');
            }, 400);
          }
        };
        
        // Use a timeout as a safety fallback in case 'load' event doesn't fire soon enough
        window.addEventListener('load', finishLoading);
        setTimeout(finishLoading, 2000); 
      })();
    </script>
  </body>
</html>
